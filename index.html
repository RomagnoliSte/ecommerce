<!DOCTYPE html>
<html lang="pt-br">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-commerce</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="styles/styles.css"> 

</head>
<body>

    <header>
        <img src="assets/images/logo.svg" alt="icone do E-commerce">

        <div class="navigation-header">  
            <a href="">Home</a>
            <a href="">Produtos</a>
            <a href="">Sobre nós</a>
            <a href="">Contato</a>
        </div>

        <nav class="button-login"> <a href=""> Login </a></nav>

    </header>

    <main>
        <img src="assets/images/Product.svg" alt="imagem do produto em destaque">
        
        <div class="container-product">
            
            <div class="avaliacoes">
                <div>
                    <img src="assets/images/star.svg" alt="Avaliacao">
                    <img src="assets/images/star.svg" alt="Avaliacao">
                    <img src="assets/images/star.svg" alt="Avaliacao">
                    <img src="assets/images/star.svg" alt="Avaliacao">
                    <img src="assets/images/star.svg" alt="Avaliacao">
                </div>
                <p>5.0 Estrelas</p>
                <span>(21.671 avaliações)</span>
            </div>

            <h1>2020 Apple MacBook Pro with Apple M1 Chip (13-inch, 8GB RAM, 256GB SSD Storage) - Space Gray</h1>
            
            <div class="valores">
                <h2>R$5.299,00</h2>
                <span>R$7.000,00</span>
                <p>24,3% OFF</p>
            </div>

            <div class="cores">
                <p>Cor</p>

                <div class="container-cores">
                    <div class="cor selecionada">
                        <div class="circulo"></div>
                    </div>

                    <div class="cor">
                        <div class="circulo claro"></div>
                </div>
                </div>
            </div>
            <nav></nav>

        </div>
    </main>
    
</body>
</html>
